<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfricanIES standalone UI</title><body><main><h1>AfricanIES standalone shipment UI</h1><p>Local fixtures are the safe default and make no network request. Real sandbox traffic is opt-in.</p><form id="login"><label><input id="real-sandbox" type="checkbox"> Use real Africanies sandbox</label><label>Sandbox Base64 credential <input id="key" type="password" autocomplete="off" disabled></label><button>Start</button></form><button id="logout" type="button" hidden>Logout</button><p id="status" role="status" aria-live="polite"></p><section id="stage" aria-live="polite"></section><template id="payment"><section><h2>Host payment confirmation</h2><p>The purchase element remains unmounted until the host confirms payment.</p><label>PayDemo outcome <select id="outcome"><option value="success">Success</option><option value="failed">Failed</option><option value="cancelled">Cancelled</option></select></label><button id="confirm-payment" type="button">Confirm PayDemo</button><p id="payment-status" role="status"></p></section></template></main><script type="module" src="./main.js"></script></body></html>
